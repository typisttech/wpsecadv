name: Go Proxy

on:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  go:
    cache-mode: none
    uses: typisttech/.github/.github/workflows/go-proxy.yml@35e5494fea692807fa0060dce74b5ed55cf5fd3a # v9.1.1
