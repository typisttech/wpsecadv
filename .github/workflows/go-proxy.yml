name: Go Proxy

on:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  go:
    cache-mode: none
    uses: typisttech/.github/.github/workflows/go-proxy.yml@4a48cb6c63f13a3a2dca9761e0035d063cff69fc # v9.1.0
