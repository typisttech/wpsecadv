name: Go Proxy

on:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  go:
    cache-mode: none
    uses: typisttech/.github/.github/workflows/go-proxy.yml@d4c46e1552c88b1e50307c79456ae6570fbc562e # v9.3.5
