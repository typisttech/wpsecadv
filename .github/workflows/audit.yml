name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '7 2 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  go:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: typisttech/.github/.github/workflows/audit-go.yml@94847736fbf18a5052dc7936b1afd3e3f61a04a3 # v8.0.0
