name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '7 2 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  go:
    uses: typisttech/.github/.github/workflows/audit-go.yml@f5f58e1acfcb05820612eb7edc25ed0eeabc625d # v6.2.0
