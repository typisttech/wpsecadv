name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '7 2 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  go:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: typisttech/.github/.github/workflows/audit-go.yml@ba4e7de660323116418d8f16ee100399c51773e9 # v9.0.0
