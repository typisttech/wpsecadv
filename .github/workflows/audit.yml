name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '7 2 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  go:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: typisttech/.github/.github/workflows/audit-go.yml@b47d0d4a4ee68f942149ec70104569519cbb9a4f # v9.4.3
    with:
      tags: e2econtainer,e2escripts
