name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '7 2 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  go:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: typisttech/.github/.github/workflows/audit-go.yml@51e7a334c027d04864092d8b5469d1ccc5dcfcb6 # v9.0.1
