name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '7 2 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  go:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: typisttech/.github/.github/workflows/audit-go.yml@c8e3ce97517cd2b2a02c3e3c1452ec19bf703175 # v9.2.0
    with:
      tags: e2econtainer,e2escripts
