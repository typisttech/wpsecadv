name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '7 2 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  go:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: typisttech/.github/.github/workflows/audit-go.yml@ce922ecb46e1daaf4320e7fb0a2c7fde6d0c0f65 # v9.3.7
    with:
      tags: e2econtainer,e2escripts
