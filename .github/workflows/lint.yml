name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  actions:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: typisttech/.github/.github/workflows/lint-actions.yml@ba4e7de660323116418d8f16ee100399c51773e9 # v9.0.0

  go:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: typisttech/.github/.github/workflows/lint-go.yml@ba4e7de660323116418d8f16ee100399c51773e9 # v9.0.0
    with:
      golangci-lint: true
      golangci-lint-version-file: .tool-versions

  fly:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: fly.toml
          sparse-checkout-cone-mode: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - run: flyctl config validate --strict
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ORG_READONLY }}

  wait-for-all-lint:
    if: cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure')
    needs:
      - actions
      - go
      - fly
    runs-on: ubuntu-slim
    steps:
      - name: Assert no required jobs were cancelled or failed
        run: exit 1
