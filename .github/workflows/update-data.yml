name: Update Data

on:
  workflow_dispatch:
  schedule:
    - cron: '34 5,17 * * 1-5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  update-data:
    permissions:
      contents: read
    cache-mode: none
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - run: go generate ./...
        env:
          WORDFENCE_INTELLIGENCE_API_KEY: ${{ secrets.WORDFENCE_INTELLIGENCE_API_KEY }}

      - uses: typisttech/.github/.github/actions/create-auto-merged-pull-request@e8fb21eeafb5416e1d47d71d5ac656b61e524af1 # v9.3.0
        with:
          client-id: ${{ vars.TASTENDRUCK_CLIENT_ID }}
          private-key: ${{ secrets.TASTENDRUCK_PRIVATE_KEY }}
          branch: "tastendruck/github_actions/go-generate/${{ github.ref_name }}"
          title: ":robot: `go generate ./...`"
          labels: go-generate
          add-paths: |
            **/*_gen.go
            **/*_gen_test.go
            **/*_gen.json
