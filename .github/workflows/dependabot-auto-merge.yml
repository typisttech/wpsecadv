name: Dependabot Auto-merge

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  dependabot:
    permissions:
      contents: read
      pull-requests: read
    cache-mode: none
    uses: typisttech/.github/.github/workflows/dependabot-auto-merge.yml@e8fb21eeafb5416e1d47d71d5ac656b61e524af1 # v9.3.0
    with:
      minor: true
      patch: true
    secrets:
      client-id: ${{ vars.TASTENDRUCK_CLIENT_ID }}
      private-key: ${{ secrets.TASTENDRUCK_PRIVATE_KEY }}
