name: Dependabot Auto-merge

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  dependabot:
    permissions:
      contents: read
      pull-requests: read
    cache-mode: none
    uses: typisttech/.github/.github/workflows/dependabot-auto-merge.yml@b6c871b621d8d9577a3846174672864880fc5071 # v9.4.1
    with:
      minor: true
      patch: true
    secrets:
      client-id: ${{ vars.TASTENDRUCK_CLIENT_ID }}
      private-key: ${{ secrets.TASTENDRUCK_PRIVATE_KEY }}
