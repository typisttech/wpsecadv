name: Dependabot Auto-merge

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependabot:
    permissions:
      contents: read
      pull-requests: read
    uses: typisttech/.github/.github/workflows/dependabot-auto-merge.yml@ba4e7de660323116418d8f16ee100399c51773e9 # v9.0.0
    with:
      minor: true
      patch: true
    secrets:
      client-id: ${{ vars.TASTENDRUCK_CLIENT_ID }}
      private-key: ${{ secrets.TASTENDRUCK_PRIVATE_KEY }}
