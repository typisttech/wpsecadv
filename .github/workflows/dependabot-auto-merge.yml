name: Dependabot Auto-merge

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

jobs:
  dependabot:
    permissions:
      contents: read
      pull-requests: read
    cache-mode: none
    uses: typisttech/.github/.github/workflows/dependabot-auto-merge.yml@9028c3cd5e28ea757373075b8aeedd97cd045767 # v9.3.2
    with:
      minor: true
      patch: true
    secrets:
      client-id: ${{ vars.TASTENDRUCK_CLIENT_ID }}
      private-key: ${{ secrets.TASTENDRUCK_PRIVATE_KEY }}
