name: Publish Container Image

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-push:
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    runs-on: ubuntu-26.04
    steps:
      - run: |
          t=$(gh api --jq .commit.committer.date "${ENDPOINT}")
          echo "mod-time=${t}" >> "${GITHUB_OUTPUT}"
        id: mod-time
        env:
          ENDPOINT: /repos/${{ github.repository }}/commits/${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        background: true

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{commit_date 'YYYYMMDDHHmmss'}},enable={{is_default_branch}}
            type=sha
            type=ref,event=branch,enable={{is_not_default_branch}}
        background: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        background: true

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - wait-all:

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-and-push
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            MOD_TIME=${{ steps.mod-time.outputs.mod-time }}
            REVISION=${{ github.sha }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

  deploy:
    needs:
      - build-and-push
    permissions:
      contents: read
    uses: $/.github/workflows/deploy.yml
    with:
      tag: latest
