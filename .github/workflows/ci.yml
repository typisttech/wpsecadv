name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    outputs:
      coverage-artifact-id: ${{ steps.upload-coverage.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - run: go test -count=1 -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      - id: upload-coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  codecov:
    needs:
      - test
    permissions:
      id-token: write
      contents: read
    cache-mode: none
    runs-on: ubuntu-slim
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          with:
            name: coverage

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: coverage.out

  e2e:
    permissions:
      contents: read
    uses: $/.github/workflows/test-e2e.yml
    with:
      url: '' # Leave blank to boot a local server for testing

  build-and-push:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs:
      - test
      - e2e
    permissions:
      contents: read
      # For docker/build-push-action
      packages: write
      # For actions/attest
      id-token: write
      attestations: write
      artifact-metadata: write
    cache-mode: none
    runs-on: ubuntu-26.04
    steps:
      - id: mod-time
        run: |
          t=$(gh api --jq .commit.committer.date "${ENDPOINT}")
          echo "mod-time=${t}" >> "${GITHUB_OUTPUT}"
        env:
          ENDPOINT: /repos/${{ github.repository }}/commits/${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        background: true

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{commit_date 'YYYYMMDDHHmmss'}},enable={{is_default_branch}}
            type=sha
            type=ref,event=branch,enable={{is_not_default_branch}}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        background: true

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        background: true

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        background: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        background: true

      - wait-all:

      - id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            MOD_TIME=${{ steps.mod-time.outputs.mod-time }}
            REVISION=${{ github.sha }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

  deploy:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs:
      - build-and-push
    permissions:
      contents: read
      packages: read
    uses: $/.github/workflows/deploy.yml
    with:
      tag: latest
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
