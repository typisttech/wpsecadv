name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: &tag-description Container image tag to deploy.
        type: &tag-type string
        default: &tag-default latest
    secrets:
      FLY_API_TOKEN:
        description: Fly deploy token to use for authentication.
        required: true

  workflow_dispatch:
    inputs:
      tag:
        description: *tag-description
        type: *tag-type
        default: *tag-default
        required: true

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref_name }}-${{ inputs.tag || 'latest' }}
  cancel-in-progress: true

permissions: {}

jobs:
  fly:
    environment: production-fly
    permissions:
      packages: read
    cache-mode: none
    runs-on: ubuntu-slim
    steps:
      - run: |
          digest=$(gh attestation verify --format json  --jq "${JQ}" --repo "${REPO}" "${IMAGE}")
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
        id: verify
        env:
          IMAGE: oci://ghcr.io/${{ github.repository }}:${{ inputs.tag || 'latest' }}
          REPO: ${{ github.repository }}
          JQ: .[0].verificationResult.statement.subject[0].digest.sha256
          GH_TOKEN: ${{ github.token }}

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - run: flyctl deploy --image "${IMAGE}"
        env:
          IMAGE: ghcr.io/${{ github.repository }}@sha256:${{ steps.verify.outputs.digest }}
          FLY_APP: ${{ vars.FLY_APP }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  test-prod:
    needs:
      - fly
    permissions:
      contents: read
    uses: $/.github/workflows/test-prod.yml
