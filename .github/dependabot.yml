version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: docker
    directories:
      - /
      - /e2e/scripts/
    schedule:
      interval: daily
    groups:
      docker-images:
        group-by: dependency-name

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
      exclude:
        - "typisttech/*"
    groups:
      typisttech:
        patterns:
          - "typisttech/*"
