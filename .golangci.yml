version: "2"

run:
  build-tags:
    - e2econtainer
    - e2escripts
  modules-download-mode: readonly
  tests: true

linters:
  enable:
    # Default
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Custom
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    # - canonicalheader # Wait for https://github.com/golangci/golangci-lint/issues/6829
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - gosmopolitan
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - loggercheck
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    # - noctx # TODO!
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - predeclared
    - promlinter
    - reassign
    - recvcheck
    - revive
    - sloglint
    - spancheck
    - tagalign
    - testableexamples
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck

  settings:
    # Default
    errcheck:
      exclude-functions:
        - fmt.Fprintln(os.Stdout)
        - (net/http.ResponseWriter).Write

    govet:
      enable-all: true
      disable:
        - fieldalignment

    staticcheck:
      checks:
        - all
        - -ST1000 # at least one file in a package should have a package comment

    # Custom
    depguard:
      rules:
        all:
          files:
            - $all
          deny:
            - pkg: encoding/json$
              desc: Use 'encoding/json/v2' or 'encoding/json/jsontext'
            - pkg: github.com/stretchr/testify
              desc: Use standard library or 'github.com/google/go-cmp/cmp'
        production:
          files:
            - "**/cmd/serve/*.go"
            - "**/internal/server/*.go"
            - "**/internal/data/*.go"
            - "**/internal/packagist/*.go"
            - "!$test"
          allow:
            - $gostd
            - "github.com/typisttech/wpsecadv/internal/data$"
            - "github.com/typisttech/wpsecadv/internal/server$"
            - "github.com/typisttech/wpsecadv/internal/packagist$"
          deny:
            - pkg: encoding/json
              desc: Do not perform JSON encoding/decoding in production server

    exhaustive:
      default-signifies-exhaustive: true

    gocritic:
      enabled-checks:
        - emptyStringTest
        - httpNoBody
        - preferStringWriter

    gocyclo:
      min-complexity: 10

    godoclint:
      enable:
        - max-len
        - no-unused-link
        - require-stdlib-doclink

    godot:
      scope: toplevel
      capital: true

    gosec:
      excludes:
        - G104 # Handled by errcheck

    iface:
      enable:
        - identical
        - unused
        - opaque
        - unusedmethod

    nolintlint:
      require-specific: true

    revive:
      enable-default-rules: true
      rules:
        - name: context-as-argument
          disabled: false
          arguments:
            - allow-types-before: "*testing.T"

        - name: exported
          disabled: true

        - name: package-comments
          disabled: true

    wrapcheck:
      extra-ignore-sigs:
        - encoding/json/v2.Marshal(
        - encoding/json/v2.Unmarshal(

  exclusions:
    generated: disable
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - goconst

      - source: "^\\s*defer\\s+"
        linters:
          - errcheck

      - source: "^\\s*fmt\\.Fprint(f|ln)\\(stderr,\\s+"
        linters:
          - errcheck

      - text: "^\\s*shadow: declaration of \"err\" shadows declaration at\\s+"
        linters:
          - govet

      - path: (main|store|_gen)\.go
        linters:
          - cyclop
          - gocyclo

      - path: internal/packagist/core_gen.go
        text: singleCaseSwitch
        linters:
          - gocritic

      - path: (_gen|_gen_test)\.go
        linters:
          - misspell

      - path: cmd/serve/(.+).go
        linters:
          - wrapcheck

      - path: internal/data/gen/(.+).go
        linters:
          - wrapcheck

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines

  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    golines:
      max-len: 120
